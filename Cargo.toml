[package]
name = "rod_validation"
version = "0.5.0"
edition = "2024"
authors = ["kommade"]
description = "A lightweight and ergonomic validation library for Rust"
readme = "README.md"
license = "GPL-3.0"
repository = "https://github.com/kommade/rod"
keywords = ["validation", "forms", "data-validation", "serde", "derive"]
categories = ["development-tools", "parsing"]

[dependencies]
regex = { version = "1.11.2", optional = true }
rod_derive = { path = "./rod_derive", version = "0.4.0" }
serde = { version = "1.0", optional = true, default-features = false }
serde_json = { version = "1.0", optional = true }
# Typed datetime support (blanket RodValidate impls). serde is enabled on
# chrono so the JSON adapters round-trip zoned/naive values out of the box.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"], optional = true }

[features]
default = []
regex = ["dep:regex", "rod_derive/regex"]
serde = ["dep:serde", "dep:serde_json"]
chrono = ["dep:chrono", "rod_derive/chrono"]

[dev-dependencies]
regex = "1.11.2"
serde_derive = "1.0"
# Async-compatibility tests: real runtime, timer and spawned tasks
# (`support::block_on` only copes with instantly-ready futures).
tokio = { version = "1", features = ["macros", "rt", "time"] }


