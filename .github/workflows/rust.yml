name: PR CI & crates.io publish

# Run cargo test on every PR. Only publish to crates.io after the PR is merged
# (when changes are pushed to the default branch).
#
# Notes:
# - Tests run on pull_request events.
# - Publish runs on pushes to `main` — change the branch name if your default
#   branch is different.
# - Publishing uses the repository secret CARGO_SECRET (mapped to
#   CARGO_REGISTRY_TOKEN). Secrets must be set in the repository settings.
# - `rod_derive` is published from its subdirectory by cd'ing into it before
#   running `cargo publish`.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  test:
    name: Run tests on PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Cache cargo registry, git index and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo tests (all targets)
        run: cargo test --all --all-targets

  publish:
    name: Publish rod_derive and rod to crates.io
    runs-on: ubuntu-latest
    # Only run publish on pushes to main (i.e., after a PR merge) and when secret exists.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Cache cargo registry, git index and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Check which crates need publishing (compare against crates.io)
        id: check-versions
        run: |
          manifest_version() { # $1 = manifest path
            grep '^version' "$1" | head -1 | sed 's/version *= *"\(.*\)"/\1/'
          }

          published_version() { # $1 = crate name; empty string when never published
            curl -fsSL "https://crates.io/api/v1/crates/$1" \
              -H 'User-Agent: rod-publish-check (github.com/kommade/rod)' \
              | jq -r '.crate.max_stable_version // ""' 2>/dev/null || echo ""
          }

          DERIVE_MANIFEST=$(manifest_version rod_derive/Cargo.toml)
          DERIVE_PUBLISHED=$(published_version rod_derive)
          VALIDATION_MANIFEST=$(manifest_version Cargo.toml)
          VALIDATION_PUBLISHED=$(published_version rod_validation)

          echo "rod_derive:     manifest=$DERIVE_MANIFEST published=${DERIVE_PUBLISHED:-<none>}"
          echo "rod_validation: manifest=$VALIDATION_MANIFEST published=${VALIDATION_PUBLISHED:-<none>}"

          # NOTE: this used to compare `git show HEAD:...` against the working
          # tree — the same commit — so it always read "unchanged" and never
          # published. The real baseline for publishing is crates.io itself.
          if [ -n "$DERIVE_PUBLISHED" ] && [ "$DERIVE_MANIFEST" = "$DERIVE_PUBLISHED" ]; then
            echo "rod_derive $DERIVE_MANIFEST is already on crates.io, skipping"
            echo "skip_derive=true" >> "$GITHUB_OUTPUT"
          else
            echo "rod_derive $DERIVE_MANIFEST is missing on crates.io, will publish"
            echo "skip_derive=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$VALIDATION_PUBLISHED" ] && [ "$VALIDATION_MANIFEST" = "$VALIDATION_PUBLISHED" ]; then
            echo "rod_validation $VALIDATION_MANIFEST is already on crates.io, skipping"
            echo "skip_validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "rod_validation $VALIDATION_MANIFEST is missing on crates.io, will publish"
            echo "skip_validation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish `rod_derive`
        # rod_validation depends on this crate, so it must go first.
        if: steps.check-versions.outputs.skip_derive != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_SECRET }}
        run: cargo publish --manifest-path rod_derive/Cargo.toml --allow-dirty

      - name: Publish `rod_validation` (waits for rod_derive to propagate)
        # The registry is eventually consistent: right after publishing
        # rod_derive, the index may not know the new version yet, so retry
        # a few times before failing.
        if: steps.check-versions.outputs.skip_validation != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_SECRET }}
        run: |
          for attempt in 1 2 3; do
            if cargo publish -p rod_validation --allow-dirty; then
              exit 0
            fi
            echo "Attempt $attempt failed; the registry may not know rod_derive yet. Retrying in 15s..."
            sleep 15
          done
          echo "rod_validation publish failed after 3 attempts."
          exit 1
